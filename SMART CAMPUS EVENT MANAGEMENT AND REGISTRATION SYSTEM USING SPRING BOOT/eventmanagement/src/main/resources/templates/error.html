<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Error - VELTECH</title>
</head>
<body>
    <section class="container py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 py-5">
                    <div class="card-body">
                        <i class="fa-solid fa-triangle-exclamation text-danger mb-4" style="font-size: 80px;"></i>
                        <h1 class="display-5 fw-bold mb-3">Oops! Something went wrong.</h1>
                        <p class="lead text-muted" th:text="${errorMessage != null ? errorMessage : 'We encountered an unexpected error.'}"></p>
                        <a th:href="@{/}" class="btn btn-primary mt-4">Return Home</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
