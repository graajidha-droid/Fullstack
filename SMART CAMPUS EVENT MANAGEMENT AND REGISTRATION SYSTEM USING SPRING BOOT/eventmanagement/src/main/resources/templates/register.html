<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Register - VELTECH</title>
</head>
<body>
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Event Info Card -->
                <div class="card mb-4 border-0 shadow-sm">
                    <div class="card-body text-center bg-light rounded">
                        <h3 class="fw-bold text-primary" th:text="${event.name}">Event Name</h3>
                        <div class="d-flex justify-content-center gap-3 mt-2 text-muted">
                            <span><i class="fa-regular fa-calendar"></i> <span th:text="${event.date}"></span></span>
                            <span><i class="fa-solid fa-location-dot"></i> <span th:text="${event.venue}"></span></span>
                        </div>
                        <div class="mt-2">
                            <span class="badge bg-success fs-6"><span th:text="${event.availableSeats}"></span> Seats Available</span>
                        </div>
                    </div>
                </div>

                <!-- Registration Form Card -->
                <div class="card border-0 shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0"><i class="fa-solid fa-user-plus"></i> Student Registration</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <form th:action="@{/register}" th:object="${registration}" method="post">
                            <input type="hidden" th:field="*{eventId}" />

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Full Name</label>
                                <input type="text" class="form-control" th:field="*{name}" placeholder="Enter your full name" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email Address</label>
                                <input type="email" class="form-control" th:field="*{email}" placeholder="student@college.edu" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department</label>
                                <select class="form-select" th:field="*{department}" th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'">
                                    <option value="">Select Department</option>
                                    <option value="Computer Science">Computer Science</option>
                                    <option value="Electrical Eng">Electrical Eng</option>
                                    <option value="Mechanical Eng">Mechanical Eng</option>
                                    <option value="Civil Eng">Civil Eng</option>
                                    <option value="Information Tech">Information Tech</option>
                                    <option value="Arts & Science">Arts & Science</option>
                                    <option value="Business Admin">Business Admin</option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Number of Tickets</label>
                                <input type="number" class="form-control" th:field="*{tickets}" min="1" max="5" value="1" th:classappend="${#fields.hasErrors('tickets')} ? 'is-invalid'">
                                <div class="form-text">Maximum 5 tickets per registration.</div>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('tickets')}" th:errors="*{tickets}"></div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary-custom btn-lg"><i class="fa-solid fa-check-circle"></i> Confirm Registration</button>
                                <a th:href="@{/}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
                
            </div>
        </div>
    </section>
</body>
</html>
