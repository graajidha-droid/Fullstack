<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Events - VELTECH</title>
</head>
<body>
    <section>
        <!-- Hero Section -->
        <div class="hero-section text-center">
            <div class="container">
                <h1 class="display-4 fw-bold mb-3 animation-fade-in">Discover Campus Events</h1>
                <p class="lead mb-4">Register for workshops, seminars, fests, and sports events happening around you.</p>
                
                <form th:action="@{/}" method="get" class="d-flex justify-content-center max-w-md mx-auto" style="max-width: 600px; margin: 0 auto;">
                    <div class="input-group input-group-lg shadow-sm">
                        <input type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Search events by name, dept, or type...">
                        <button class="btn btn-accent" type="submit"><i class="fa-solid fa-search"></i> Search</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="container" id="events">
            <div class="row mb-4 align-items-center">
                <div class="col-md-6">
                    <h2 class="fw-bold">Upcoming Events</h2>
                </div>
                <div class="col-md-6 text-md-end">
                    <a th:if="${keyword != null and !keyword.isEmpty()}" th:href="@{/}" class="btn btn-outline-secondary btn-sm">Clear Search</a>
                </div>
            </div>

            <!-- Events Grid -->
            <div class="row g-4">
                <div class="col-lg-4 col-md-6" th:each="event : ${events}">
                    <div class="card h-100 event-card">
                        <div class="card-header card-header-custom d-flex justify-content-between align-items-center">
                            <span th:text="${event.type}"><i class="fa-solid fa-tag"></i> Type</span>
                            <span class="badge bg-warning text-dark"><i class="fa-solid fa-chair"></i> <span th:text="${event.availableSeats}">0</span> seats left</span>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title fw-bold" th:text="${event.name}">Event Name</h5>
                            <p class="card-text text-muted mb-4"><i class="fa-solid fa-building"></i> <span th:text="${event.department}">Dept</span></p>
                            
                            <div class="mt-auto">
                                <p class="mb-1"><i class="fa-regular fa-calendar text-primary"></i> <strong th:text="${event.date}">Date</strong></p>
                                <p class="mb-3"><i class="fa-solid fa-location-dot text-danger"></i> <span th:text="${event.venue}">Venue</span></p>
                                
                                <a th:if="${event.availableSeats > 0}" th:href="@{/register/{id}(id=${event.id})}" class="btn btn-primary-custom w-100 fw-bold">Register Now</a>
                                <button th:if="${event.availableSeats <= 0}" class="btn btn-secondary w-100 fw-bold" disabled>Sold Out</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(events)}">
                    <i class="fa-regular fa-calendar-xmark fa-4x text-muted mb-3"></i>
                    <h4 class="text-muted">No events found</h4>
                </div>
            </div>

            <!-- Pagination -->
            <nav th:if="${totalPages > 1}" class="mt-5" aria-label="Event pagination">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/(page=${currentPage - 1}, keyword=${keyword})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/(page=${currentPage + 1}, keyword=${keyword})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</body>
</html>
