<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Admin Login - VELTECH</title>
</head>
<body>
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow border-0 mt-5">
                    <div class="card-header bg-primary text-white text-center py-4">
                        <i class="fa-solid fa-lock fa-3x mb-2"></i>
                        <h3 class="mb-0 fw-bold">Admin Portal</h3>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            <i class="fa-solid fa-triangle-exclamation"></i> Invalid username or password.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            <i class="fa-solid fa-circle-check"></i> You have been logged out successfully.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-muted">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" class="form-control" name="username" placeholder="Enter username" required autofocus>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold text-muted">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="fa-solid fa-key"></i></span>
                                    <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                                </div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary-custom btn-lg fw-bold">Sign In</button>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
