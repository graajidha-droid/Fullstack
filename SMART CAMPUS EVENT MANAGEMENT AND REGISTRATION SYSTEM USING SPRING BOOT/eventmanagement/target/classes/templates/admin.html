<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Admin Dashboard - VELTECH</title>
</head>
<body>
    <section class="container py-5">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="fa-solid fa-gauge text-primary"></i> Admin Dashboard</h2>
            <div>
                <a th:href="@{/admin/registrations}" class="btn btn-outline-primary"><i class="fa-solid fa-users"></i> View Registrations</a>
                <a th:href="@{/admin/manage-admins}" class="btn btn-outline-secondary"><i class="fa-solid fa-user-shield"></i> Admins</a>
            </div>
        </div>

        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${param.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Metrics Cards -->
        <div class="row mb-5">
            <div class="col-md-6">
                <div class="card bg-primary text-white shadow h-100 border-0">
                    <div class="card-body d-flex align-items-center">
                        <div class="me-3">
                            <i class="fa-solid fa-calendar-check fa-3x opacity-50"></i>
                        </div>
                        <div>
                            <h5 class="card-title mb-0 text-uppercase fw-semibold" style="letter-spacing: 1px;">Total Events</h5>
                            <h2 class="display-5 fw-bold mb-0" th:text="${totalEvents}">0</h2>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-success text-white shadow h-100 border-0 mt-3 mt-md-0">
                    <div class="card-body d-flex align-items-center">
                        <div class="me-3">
                            <i class="fa-solid fa-ticket fa-3x opacity-50"></i>
                        </div>
                        <div>
                            <h5 class="card-title mb-0 text-uppercase fw-semibold" style="letter-spacing: 1px;">Total Registrations</h5>
                            <h2 class="display-5 fw-bold mb-0" th:text="${totalRegistrations}">0</h2>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Add Event Form -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        <i class="fa-solid fa-plus-circle"></i> Add New Event
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/save}" th:object="${event}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Event Name</label>
                                <input type="text" class="form-control" th:field="*{name}" required th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Department</label>
                                <input type="text" class="form-control" th:field="*{department}" required th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Type</label>
                                <select class="form-select" th:field="*{type}" required>
                                    <option value="Conference">Conference</option>
                                    <option value="Workshop">Workshop</option>
                                    <option value="Seminar">Seminar</option>
                                    <option value="Sports">Sports</option>
                                    <option value="Festival">Festival</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Date</label>
                                    <input type="date" class="form-control" th:field="*{date}" required th:classappend="${#fields.hasErrors('date')} ? 'is-invalid'">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-semibold">Seats</label>
                                    <input type="number" class="form-control" th:field="*{availableSeats}" min="1" required th:classappend="${#fields.hasErrors('availableSeats')} ? 'is-invalid'">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Venue</label>
                                <input type="text" class="form-control" th:field="*{venue}" required th:classappend="${#fields.hasErrors('venue')} ? 'is-invalid'">
                            </div>
                            <button type="submit" class="btn btn-primary-custom w-100"><i class="fa-solid fa-save"></i> Save Event</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Event List -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">
                        <i class="fa-solid fa-list"></i> Manage Events
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Name</th>
                                        <th>Dept / Type</th>
                                        <th>Date</th>
                                        <th>Seats</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="e : ${events}">
                                        <td class="fw-bold" th:text="${e.name}">Name</td>
                                        <td>
                                            <span th:text="${e.department}"></span><br>
                                            <small class="text-muted" th:text="${e.type}"></small>
                                        </td>
                                        <td th:text="${e.date}">Date</td>
                                        <td><span class="badge bg-success rounded-pill" th:text="${e.availableSeats}"></span></td>
                                        <td class="text-end">
                                            <a th:href="@{/admin/delete/{id}(id=${e.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this event?');"><i class="fa-solid fa-trash"></i></a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(events)}">
                                        <td colspan="5" class="text-center py-4 text-muted">No events available. Add one to get started!</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
